# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name wiki.k71style.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Configuration for wiki.k71style.xyz
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wiki.k71style.xyz;
    client_max_body_size 500m;

    # SSL Certificates (Let's Encrypt k71style.xyz or *.k71style.xyz)
    ssl_certificate /etc/letsencrypt/live/k71style.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k71style.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # WebSocket Stream Endpoint (/ws) -> FastAPI Backend
    location /ws {
        set $backend_ws http://llm-wiki-backend:8000;
        proxy_pass $backend_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # REST API (/api) -> FastAPI Backend
    location /api {
        set $backend_api http://llm-wiki-backend:8000;
        proxy_pass $backend_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Web UI -> Next.js Frontend
    location / {
        set $frontend_app http://llm-wiki-frontend:3000;
        proxy_pass $frontend_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
